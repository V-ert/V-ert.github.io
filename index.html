<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro Rápido de Gastos</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .card { background: #1e293b; border-radius: 16px; padding: 20px; width: 100%; max-width: 380px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    h2 { margin-top: 0; text-align: center; color: #38bdf8; font-size: 1.3rem; }
    label { font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px; display: block; }
    input[type="number"] { width: 100%; box-sizing: border-box; font-size: 2rem; text-align: center; padding: 12px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: #38bdf8; font-weight: bold; margin-bottom: 16px; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
    .cat-btn { background: #334155; border: 2px solid transparent; color: #f8fafc; padding: 12px 8px; border-radius: 10px; font-size: 0.9rem; font-weight: 500; cursor: pointer; text-align: center; }
    .cat-btn.active { border-color: #38bdf8; background: #0284c7; }
    .save-btn { width: 100%; background: #10b981; border: none; color: white; padding: 16px; border-radius: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
    .save-btn:disabled { background: #475569; }
    #msg { text-align: center; margin-top: 12px; font-size: 0.9rem; min-height: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>💸 Registrar Gasto</h2>
    
    <label>Monto</label>
    <input type="number" id="monto" inputmode="decimal" placeholder="0.00" step="any" autofocus>

    <label>Categoría</label>
    <div class="grid" id="cat-group">
      <button class="cat-btn" onclick="selectCat(this, 'Comida')">🍔 Comida</button>
      <button class="cat-btn" onclick="selectCat(this, 'Taxi')">🚕 Taxi</button>
      <button class="cat-btn" onclick="selectCat(this, 'Transporte público')">🚌 Transp. Público</button>
      <button class="cat-btn" onclick="selectCat(this, 'Trabajo')">💼 Trabajo</button>
      <button class="cat-btn" onclick="selectCat(this, 'Ropa')">👕 Ropa</button>
      <button class="cat-btn" onclick="selectCat(this, 'Salidas')">🎉 Salidas</button>
      <button class="cat-btn" style="grid-column: span 2;" onclick="selectCat(this, 'Regalos')">🎁 Regalos</button>
    </div>

    <button class="save-btn" id="submit-btn" onclick="enviarGasto()">Guardar Gasto</button>
    <div id="msg"></div>
  </div>

  <script>
    // PEGA AQUÍ LA URL DE TU APPS SCRIPT
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzEzBhuupyRIUxlOIcPQKcSJTpy6YFkPzWe0YX6Bim5A5r3ytndLjlwcduQZl6JXQaA/exec";

    let selectedCategory = "";

    function selectCat(btn, cat) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedCategory = cat;
    }

    async function enviarGasto() {
      const monto = document.getElementById('monto').value;
      const msg = document.getElementById('msg');
      const btn = document.getElementById('submit-btn');

      if (!monto || Number(monto) <= 0) {
        msg.style.color = "#f87171";
        msg.innerText = "Ingresa un monto válido.";
        return;
      }
      if (!selectedCategory) {
        msg.style.color = "#f87171";
        msg.innerText = "Selecciona una categoría.";
        return;
      }

      btn.disabled = true;
      msg.style.color = "#94a3b8";
      msg.innerText = "Guardando en Google Sheets...";

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ monto: monto, categoria: selectedCategory })
        });

        msg.style.color = "#34d399";
        msg.innerText = "¡Gasto guardado con éxito! ✅";
        document.getElementById('monto').value = "";
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        selectedCategory = "";
      } catch (err) {
        msg.style.color = "#f87171";
        msg.innerText = "Error al conectar con Sheets.";
      } finally {
        btn.disabled = false;
        setTimeout(() => { if (msg.innerText.includes("éxito")) msg.innerText = ""; }, 3000);
      }
    }
  </script>
</body>
</html>
